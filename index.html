@keyframes utoniumGlow {
  0% {

#webamp-anchor {

}

#weed-layer {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}

.weed-leaf {
  position: fixed;
  top: -120px;
  left: 0;
  z-index: 0;
  pointer-events: none;
  font-family: "Font Awesome 5 Free";
  font-weight: 900;
  opacity: 0;
  will-change: transform, opacity;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  transform: translate3d(0, -120px, 0) rotate(0deg);
  animation-name: weedFall;
  animation-timing-function: linear;
  animation-fill-mode: forwards;
}

@keyframes weedFall {
  0% {
    opacity: 0;
    transform: translate3d(0, -120px, 0) rotate(0deg);
  }
  10% {
    opacity: 1;
  }
  85% {
    opacity: 1;
  }
  100% {
    opacity: 0;
    transform: translate3d(var(--drift), 115vh, 0) rotate(var(--rotation));
  }
}

.weed-leaf-ending {
  animation: weedFadeOut 1s linear forwards !important;
}

@keyframes weedFadeOut {
  0% { opacity: var(--fade-start-opacity); }
  100% { opacity: 0; }
}
</style>

<script>
function tickClock() {
  var d = new Date();
  var h = d.getHours();
  var m = d.getMinutes();
  var s = d.getSeconds();
  var ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12;
  if (h === 0) h = 12;
  if (m < 10) m = '0' + m;
  if (s < 10) s = '0' + s;
  document.getElementById('uraniumClock').textContent = h + ':' + m + ':' + s + ' ' + ampm;
}
setInterval(tickClock, 1000);
tickClock();

window.addEventListener("DOMContentLoaded", function() {
  if (window.Webamp) {
    var anchor = document.getElementById("webamp-anchor");
    var webamp = new Webamp({
      initialTracks: []
    });
    webamp.renderWhenReady(anchor);
  }
});
