<script>
function updateArcadeClickArea(){
const stage=document.getElementById("stage");
const arcade=document.getElementById("arcade-click-layer");
const anchor=document.getElementById("webamp-anchor");
if(!stage||!arcade||!anchor)return;
const stageRect=stage.getBoundingClientRect();
const candidates=Array.from(anchor.querySelectorAll("*"));
const visibleRects=[];
candidates.forEach(element=>{
const rect=element.getBoundingClientRect();
const style=window.getComputedStyle(element);
if(style.display==="none"||style.visibility==="hidden"||Number(style.opacity)===0||rect.width<100||rect.height<50||rect.width>600||rect.height>700)return;
visibleRects.push(rect);
});
if(visibleRects.length===0){arcade.style.clipPath="inset(100% 100% 0 0)";return}
let left=Math.min(...visibleRects.map(rect=>rect.left));
let top=Math.min(...visibleRects.map(rect=>rect.top));
let right=Math.max(...visibleRects.map(rect=>rect.right));
let bottom=Math.max(...visibleRects.map(rect=>rect.bottom));
left=Math.max(left,stageRect.left);
top=Math.max(top,stageRect.top);
right=Math.min(right,stageRect.right);
bottom=Math.min(bottom,stageRect.bottom);
if(right<=left||bottom<=top){arcade.style.clipPath="inset(100% 100% 0 0)";return}
const clipTop=top-stageRect.top;
const clipRight=stageRect.right-right;
const clipBottom=stageRect.bottom-bottom;
const clipLeft=left-stageRect.left;
arcade.style.clipPath=`inset(${clipTop}px ${clipRight}px ${clipBottom}px ${clipLeft}px)`;
}
window.addEventListener("DOMContentLoaded",()=>{
const anchor=document.getElementById("webamp-anchor");
if(!anchor)return;
const observer=new MutationObserver(()=>{updateArcadeClickArea()});
observer.observe(anchor,{attributes:true,childList:true,subtree:true});
window.addEventListener("resize",updateArcadeClickArea);
window.addEventListener("scroll",updateArcadeClickArea,true);
document.addEventListener("mousemove",updateArcadeClickArea,true);
setInterval(updateArcadeClickArea,100);
updateArcadeClickArea();
});
</script>
<script>
const greenShades=["#003300","#004000","#005000","#006000","#007000","#008000","#009000","#00A000","#00B000","#00C000","#00D000","#00E000","#00F000","#00FF00","#20FF20","#33FF33","#44FF44","#55FF55","#66FF33","#80FF00"];
let weedLeafTimer=null;
let weedLeavesActive=false;
let weedEnding=false;
function createWeedLeaf(){
if(!weedLeavesActive)return;
const leaf=document.createElement("i");
leaf.className="fas fa-cannabis weed-leaf";
const size=30+Math.random()*90;
const duration=7+Math.random()*5;
const drift=-250+Math.random()*500;
const rotation=360+Math.random()*1080;
leaf.style.left=Math.random()*100+"vw";
leaf.style.fontSize=size+"px";
const shade=greenShades[Math.floor(Math.random()*greenShades.length)];
leaf.style.color=shade;
leaf.style.setProperty("--drift",drift+"px");
leaf.style.setProperty("--rotation",rotation+"deg");
leaf.style.animationDuration=duration+"s";
document.getElementById("weed-layer").appendChild(leaf);
setTimeout(function(){if(leaf.parentNode)leaf.remove()},(duration+1)*1000);
}
function startWeedLeaves(){
if(weedLeavesActive)return;
weedLeavesActive=true;
weedEnding=false;
for(let i=0;i<45;i++){setTimeout(function(){if(weedLeavesActive)createWeedLeaf()},i*70)}
weedLeafTimer=setInterval(function(){if(weedLeavesActive)createWeedLeaf()},100);
}
function fadeOutWeedLeaves(){
if(!weedLeavesActive)return;
weedLeavesActive=false;
weedEnding=true;
if(weedLeafTimer!==null){clearInterval(weedLeafTimer);weedLeafTimer=null}
setTimeout(function(){weedEnding=false},1100);
}
function stopWeedLeaves(){fadeOutWeedLeaves()}
function is420Time(){
const now=new Date();
const timeZone=Intl.DateTimeFormat().resolvedOptions().timeZone||"";
const europeanTimeZone=timeZone.startsWith("Europe/");
const hour=now.getHours();
return now.getMinutes()===20&&(hour===4||hour===(europeanTimeZone?14:16));
}
function updateWeedLeaves(){if(is420Time()){startWeedLeaves()}else{stopWeedLeaves()}}
function updateClock(){
const now=new Date();
const clockEl=document.getElementById("uraniumClock");
const timeZone=Intl.DateTimeFormat().resolvedOptions().timeZone||"";
const europeanTimeZone=timeZone.startsWith("Europe/");
if(europeanTimeZone){clockEl.textContent=now.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false})}
else{clockEl.textContent=now.toLocaleTimeString([],{hour:"numeric",minute:"2-digit",second:"2-digit",hour12:true})}
const rastaTime=now.getMinutes()===20&&(now.getHours()===4||now.getHours()===(europeanTimeZone?14:16));
if(rastaTime){
clockEl.style.backgroundImage="linear-gradient(to bottom,#FF0000 0%,#FF0000 38%,#FFFF00 38%,#FFFF00 68%,#00FF00 68%,#00FF00 100%)";
clockEl.style.webkitBackgroundClip="text";
clockEl.style.webkitTextFillColor="transparent";
clockEl.style.backgroundClip="text";
clockEl.style.paddingTop="0.1em";
clockEl.style.lineHeight="1";
clockEl.style.display="inline-block";
}else{
clockEl.style.backgroundImage="none";
clockEl.style.webkitBackgroundClip="initial";
clockEl.style.webkitTextFillColor="";
clockEl.style.backgroundClip="initial";
clockEl.style.color="#000000";
clockEl.style.paddingTop="initial";
clockEl.style.lineHeight="initial";
clockEl.style.display="block";
}
}
updateClock();
updateWeedLeaves();
setInterval(updateClock,250);
setInterval(updateWeedLeaves,250);
</script>
