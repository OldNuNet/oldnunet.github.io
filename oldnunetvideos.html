<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Transparent SWF with Ruffle</title>

<script>
window.RufflePlayer = window.RufflePlayer || {};
window.RufflePlayer.config = {
  autoplay: true,
  backgroundColor: null,
  wmode: "transparent",
  openUrlMode: "sameTab"
};
</script>

<script src="1delet1.dat/@ruffle-rs/ruffle"></script>

<style>
html, body {
  margin: 0;
  padding: 0;
  min-width: 1200px;
  overflow-x: auto;
  height: 100%;
}

body {
  background: red;
  background-image: url('bluebackgrounddither.png');
  background-repeat: inherit;
  background-size: 1920px 1080px;
  background-attachment: inherit;
}

#world {
  position: relative;
  width: 1200px;
  margin: 0 auto;
}

#stage {
  position: relative;
  width: 550px;
  height: 400px;
  margin: 50px auto 0 auto;
}

#flash-container {
  width: 100%;
  height: 100%;
  position: relative;
}

ruffle-player,
ruffle-player canvas {
  width: 100%;
  height: 100%;
  display: block;
  background: transparent !important;
}

#layer1 {
  position: absolute;
  top: 0;
  left: -320px;
}

#layer2 {
  position: absolute;
  top: 0;
  right: -320px;
}

#layer2 img {
  transform: scaleX(-1);
}

#layer5 {
  position: absolute;
  right: -260px;
  top: 40px;
  width: 239px;
  color: #00FF00;
  font-family: 'Bitsumishi', sans-serif;
  font-size: large;
}

#layer4 {
  position: absolute;
  bottom: -45px;
  right: -260px;
}

#layer3 {
  position: absolute;
  bottom: -70px;
  right: -260px;
}

#layer3 img,
#layer4 img {
  display: block;
  border: 0;
}

#layer7 {
  position: absolute;
  width: 88px;
  height: 31px;
  z-index: 0;
  left: 10px;
  bottom: 10px;
}

.auto-style2 {
  padding-bottom: 0px;
  text-align: center;
  margin-bottom: 0px;
}

#layer10 {
  position: absolute;
  width: 88px;
  height: 31px;
  z-index: 0;
  left: 10px;
  bottom: 10px;
}
</style>

<script>
window.addEventListener("DOMContentLoaded", () => {
  const ruffle = window.RufflePlayer.newest();
  const container = document.getElementById("flash-container");
  const player = ruffle.createPlayer();

  container.appendChild(player);
  player.load("usflash.swf");
});
</script>

</head>

<body>

<div id="world" style="left: 0px; top: 50px">

  <div id="layer9" style="position: absolute; width: 700px; height: 96px; z-index: 1; left: 247px; top: -96px" class="auto-style2">
    <object id="flash3" data="gearuistatic.swf" style="width: 699px; height: 96px" type="application/x-shockwave-flash">
      <param name="movie" value="gearuistatic.swf">
      <param name="quality" value="High">
    </object>
  </div>

  <div id="stage">

    <div id="layer1" style="z-index: 5; left: -264px; top: -17px; width: 272px; height: 591px;">
      <img alt="" src="bubble2.png" height="600">
    </div>

    <div id="layer10" style="position: absolute; width: 552px; height: 672px; z-index: 6; left: -4px; bottom: -261px">
      <img alt="" height="679" src="bigwindow.png" width="553">
    </div>

  </div>

</div>

</body>
</html>
